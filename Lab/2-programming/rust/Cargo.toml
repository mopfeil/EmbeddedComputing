[package]
name = "et1"
version = "0.1.0"
edition = "2024"
description = "Lab task 2: programming the ET1 robot on the Raspberry Pi Pico (Wokwi)"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embedded-hal = "1.0.0"
panic-halt = "1.0.0"
rp-pico = "0.9.0"

[profile.release]
debug = false        # small ELF: Wokwi loads it quickly
