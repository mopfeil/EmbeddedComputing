; PlatformIO build for the Wokwi simulator (and a real Pico).
; The arduino-pico core (Earle Philhower) comes from the community platform
; below. Build: PlatformIO toolbar (check mark) or Terminal > Run Build Task.
; Then F1 -> "Wokwi: Start Simulator" (reads wokwi.toml).

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
