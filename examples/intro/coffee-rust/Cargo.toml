[package]
name    = "coffee"
version = "0.1.0"
edition = "2021"
description = "Coffee machine (chapter Introduction) in Rust on the Arduino Uno, simulated in Wokwi"

[[bin]]
name  = "coffee"
test  = false
bench = false

[dependencies]
panic-halt = "1.0.0"
ufmt       = "0.2.0"

[dependencies.arduino-hal]
git      = "https://github.com/rahix/avr-hal"
rev      = "e5c8f37fe48419956e722490a82b9ca9b9fc61a2"
features = ["arduino-uno"]

# AVRs have very little program memory: optimise for size
[profile.dev]
panic     = "abort"
lto       = true
opt-level = "s"

[profile.release]
panic         = "abort"
codegen-units = 1
debug         = true
lto           = true
opt-level     = "s"
