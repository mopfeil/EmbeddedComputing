[package]
name = "pico-modelling"
version = "0.1.0"
edition = "2024"
description = "Coffee machine state machine on the Raspberry Pi Pico (chapter Modelling, Wokwi)"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embedded-hal = "1.0.0"
panic-halt = "1.0.0"
rp-pico = "0.9.0"
coffee-fsm = { path = "../coffee-fsm" }   # the tested state machine

[profile.dev]
opt-level = 1

[profile.release]
debug = 2
