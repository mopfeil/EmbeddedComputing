; PlatformIO build for the Wokwi simulator (and a real board).
; The arduino-pico core (Earle Philhower) for RP2040 and RP2350 comes from
; the community platform below; the official "raspberrypi" platform has
; neither this core nor the Pico 2.
; Build: PlatformIO toolbar (check mark) or Run Task "1p: build".
; Then F1 -> "Wokwi: Start Simulator" (reads wokwi.toml).

[env:pico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
