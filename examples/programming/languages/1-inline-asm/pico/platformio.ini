; PlatformIO build for the Wokwi simulator (and a real board).
;
; Environment: pico2  ->  board = rpipico2  =  Raspberry Pi Pico 2 (RP2350, Cortex-M33)
; It must match diagram.json and the path in wokwi.toml (.pio/build/pico2/).
; smlad is a DSP instruction of the Cortex-M33. Built for the RP2040
; (board = rpipico) the assembler stops with "selected processor does not
; support `smlad ...' in Thumb mode": the Cortex-M0+ has no DSP instructions.
;
; The arduino-pico core (Earle Philhower) for RP2040 and RP2350 comes from
; the community platform below; the official "raspberrypi" platform has
; neither this core nor the Pico 2.
; Build: PlatformIO toolbar (check mark) or Run Task "1p: build for Pico 2".
; Then F1 -> "Wokwi: Start Simulator" (reads wokwi.toml). Expected output and
; typical errors: README.md in this folder.

[env:pico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
