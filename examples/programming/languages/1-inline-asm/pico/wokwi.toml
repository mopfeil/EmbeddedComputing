# Wokwi for VS Code: build with PlatformIO, then F1 -> "Wokwi: Start Simulator".
# Output in the serial monitor (Serial1 on GP0/GP1, 115200 baud).
# Board: Pico 2 (diagram.json), PlatformIO environment pico2.
# Expected: "smlad ... 1.9x faster" and "results identical" (see README.md).
[wokwi]
version = 1
firmware = ".pio/build/pico2/firmware.uf2"
elf = ".pio/build/pico2/firmware.elf"
