; PlatformIO build for the Wokwi simulator (and a real board).
;
; Environment: pico  ->  board = rpipico  =  Raspberry Pi Pico (RP2040, Cortex-M0+)
; It must match diagram.json and the path in wokwi.toml (.pio/build/pico/).
; The Rust version (../rust) and MicroPython (3-python/pico) need no
; PlatformIO at all.
;
; The arduino-pico core (Earle Philhower) for RP2040 and RP2350 comes from
; the community platform below; the official "raspberrypi" platform has
; neither this core nor the Pico 2.
; Build: PlatformIO toolbar (check mark) or Run Task "2p: C - build for Pico".
; Then F1 -> "Wokwi: Start Simulator" (reads wokwi.toml). Expected output and
; typical errors: README.md in this folder.

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
